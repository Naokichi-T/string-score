<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- string-score のファビコン：青い角丸の四角に、うすい縦線4本（弦）と白い8分音符 -->
  <rect width="64" height="64" rx="14" fill="#2563eb"/>
  <!-- 弦（うすい白の縦線4本） -->
  <g stroke="#fff" stroke-width="2.4" opacity="0.55">
    <line x1="14" y1="8" x2="14" y2="56"/>
    <line x1="26" y1="8" x2="26" y2="56"/>
    <line x1="38" y1="8" x2="38" y2="56"/>
    <line x1="50" y1="8" x2="50" y2="56"/>
  </g>
  <!-- 8分音符（玉・符尾・旗） -->
  <g fill="#fff">
    <ellipse cx="28" cy="44" rx="10" ry="7.4" transform="rotate(-22 28 44)"/>
    <rect x="34.6" y="10" width="4.2" height="33"/>
    <path d="M38.8 10 q12 6 9 20 q-1 -9 -9 -11 z"/>
  </g>
</svg>
